<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>tegaki.svg 原稿テンプレート生成</title>
<style>
  :root{
    --ink:#14171c;
    --panel:#1b2028;
    --panel2:#232a35;
    --accent:#4f6d8f;
    --accent-soft:#7d95ac;
    --line:#333c48;
    --paper:#f7f7f5;
    --guide:#b7b7b7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:#e7e9ec;
    font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    display:flex;
  }
  #controls{
    width:340px;
    min-width:340px;
    height:100vh;
    overflow-y:auto;
    background:var(--panel);
    padding:20px 18px 40px;
    border-right:1px solid var(--line);
  }
  #controls h1{
    font-size:15px;
    letter-spacing:.02em;
    margin:0 0 2px;
    color:#fff;
  }
  #controls .sub{
    font-size:11px;
    color:var(--accent-soft);
    margin-bottom:20px;
  }
  fieldset{
    border:1px solid var(--line);
    border-radius:6px;
    margin:0 0 14px;
    padding:10px 12px 12px;
  }
  legend{
    font-size:11px;
    color:var(--accent-soft);
    padding:0 4px;
  }
  label.row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    padding:3px 0;
    cursor:pointer;
  }
  label.row span.count{
    margin-left:auto;
    font-size:11px;
    color:#8b94a1;
  }
  .num-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:12px;
    margin:6px 0;
  }
  .num-row input[type=number]{
    width:70px;
    background:var(--panel2);
    border:1px solid var(--line);
    color:#fff;
    border-radius:4px;
    padding:4px 6px;
    font-size:12px;
  }
  textarea{
    width:100%;
    height:60px;
    background:var(--panel2);
    border:1px solid var(--line);
    color:#fff;
    border-radius:4px;
    padding:6px;
    font-size:13px;
    resize:vertical;
  }
  input[type=color]{
    width:36px;height:24px;border:none;background:none;padding:0;
  }
  input[type=range]{
    width:100%;
  }
  button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    margin-top:6px;
  }
  #generate{
    background:var(--accent);
    color:#fff;
  }
  #generate:hover{background:#5c7ea3;}
  #printBtn,#jsonBtn{
    background:var(--panel2);
    color:#e7e9ec;
    border:1px solid var(--line);
  }
  #printBtn:hover,#jsonBtn:hover{border-color:var(--accent-soft);}
  #stats{
    font-size:11px;
    color:#8b94a1;
    margin-top:10px;
    line-height:1.6;
    border-left:2px solid transparent;
    padding-left:8px;
    transition:border-color .15s, color .15s;
  }
  #stats.flash{
    border-left-color:var(--accent-soft);
    color:#fff;
  }
  #viewer{
    flex:1;
    height:100vh;
    overflow-y:auto;
    background:#3a4048;
    padding:24px;
  }
  .page{
    background:var(--paper);
    width:210mm;
    height:297mm;
    margin:0 auto 24px;
    box-shadow:0 4px 18px rgba(0,0,0,.4);
    position:relative;
    padding:12mm;
  }
  .page-head{
    display:flex;
    justify-content:space-between;
    font-size:8px;
    color:#999;
    font-family:sans-serif;
    margin-bottom:2mm;
  }
  .grid{
    display:grid;
    gap:0;
  }
  .cell{
    position:relative;
    border:0.3pt solid #ccc;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .cell .idx{
    position:absolute;
    top:1px;
    left:2px;
    font-size:6px;
    color:#aaa;
    font-family:sans-serif;
  }
  .cell .guide{
    line-height:1;
  }
  .cell.empty{border-color:#e5e5e5;}
  .tombo{
    position:absolute;
    width:5mm;
    height:5mm;
    pointer-events:none;
  }
  .tombo::before,.tombo::after{
    content:"";
    position:absolute;
    background:#000;
  }
  .tombo::before{width:100%;height:0.3pt;top:50%;}
  .tombo::after{height:100%;width:0.3pt;left:50%;}
  .tombo.tl{top:6mm;left:6mm;}
  .tombo.tr{top:6mm;right:6mm;}
  .tombo.bl{bottom:6mm;left:6mm;}
  .tombo.br{bottom:6mm;right:6mm;}
  .credit{
    position:absolute;
    bottom:3mm;
    right:6mm;
    font-size:7px;
    color:#bbb;
    font-family:sans-serif;
    letter-spacing:.02em;
  }

  @media print{
    #controls{display:none;}
    #viewer{
      background:#fff;
      padding:0;
      overflow:visible;
      height:auto;
    }
    .page{
      box-shadow:none;
      margin:0;
      page-break-after:always;
    }
    @page{ size:A4; margin:0; }
  }
</style>
</head>
<body>

<div id="controls">
  <h1>tegaki.svg 原稿テンプレート生成</h1>
  <div class="sub">書いてもらう原稿を自動レイアウト。座標=文字の対応をJSONで書き出せます。</div>

  <fieldset>
    <legend>文字セット</legend>
    <label class="row"><input type="checkbox" id="setHira" checked> ひらがな（濁点・拗音含む）<span class="count" id="cHira"></span></label>
    <label class="row"><input type="checkbox" id="setKata" checked> カタカナ（濁点・拗音含む）<span class="count" id="cKata"></span></label>
    <label class="row"><input type="checkbox" id="setDigit" checked> 数字 0-9<span class="count" id="cDigit"></span></label>
    <label class="row"><input type="checkbox" id="setAlpha" checked> 英字 A-Z / a-z<span class="count" id="cAlpha"></span></label>
    <label class="row"><input type="checkbox" id="setSymbol" checked> 記号（句読点・かっこ等）<span class="count" id="cSymbol"></span></label>
    <label class="row"><input type="checkbox" id="setKanji" checked> 常用漢字 2136字<span class="count" id="cKanji"></span></label>
  </fieldset>

  <fieldset>
    <legend>追加の文字（任意）</legend>
    <textarea id="customChars" placeholder="ここに貼り付けた文字も末尾に追加されます"></textarea>
    <label class="row"><input type="checkbox" id="dedupe" checked> 重複した文字は1つにまとめる</label>
  </fieldset>

  <fieldset>
    <legend>グリッド設定</legend>
    <div class="num-row"><span>列数（横）</span><input type="number" id="cols" value="10" min="4" max="20"></div>
    <div class="num-row"><span>行数（縦）</span><input type="number" id="rows" value="12" min="4" max="24"></div>
    <div class="num-row"><span>余白 (mm)</span><input type="number" id="margin" value="12" min="5" max="30"></div>
    <label class="row"><input type="checkbox" id="showTombo" checked> トンボ（位置合わせマーク）を入れる</label>
    <label class="row"><input type="checkbox" id="showIdx" checked> マスに通し番号を表示</label>
  </fieldset>

  <fieldset>
    <legend>ガイド文字</legend>
    <div class="num-row"><span>色</span><input type="color" id="guideColor" value="#bdbdbd"></div>
    <div class="num-row"><span>太さ</span>
      <select id="guideWeight" style="background:var(--panel2);color:#fff;border:1px solid var(--line);border-radius:4px;">
        <option value="300">細字</option>
        <option value="400" selected>標準</option>
        <option value="700">太字</option>
      </select>
    </div>
  </fieldset>

  <button id="generate">この設定でテンプレート生成</button>
  <button id="printBtn">印刷 / PDFとして保存</button>
  <button id="jsonBtn">文字順序をJSONで書き出す</button>

  <div id="stats"></div>
</div>

<div id="viewer"></div>

setCount("cKata", KATAKANA);
setCount("cDigit", DIGITS);
setCount("cAlpha", ALPHA);
setCount("cSymbol", SYMBOLS);
setCount("cKanji", KANJI_JOYO);

let currentList = [];

function buildList(){
  let list = [];
  if(document.getElementById("setHira").checked) list.push(...HIRAGANA);
  if(document.getElementById("setKata").checked) list.push(...KATAKANA);
  if(document.getElementById("setDigit").checked) list.push(...DIGITS);
  if(document.getElementById("setAlpha").checked) list.push(...ALPHA);
  if(document.getElementById("setSymbol").checked) list.push(...SYMBOLS);
  if(document.getElementById("setKanji").checked) list.push(...KANJI_JOYO);
  const custom = document.getElementById("customChars").value.replace(/\s/g,"");
  if(custom) list.push(...custom);

  if(document.getElementById("dedupe").checked){
    list = [...new Set(list)];
  }
  return list;
}

function render(){
  const list = buildList();
  currentList = list;

  const cols = parseInt(document.getElementById("cols").value) || 10;
  const rows = parseInt(document.getElementById("rows").value) || 12;
  const margin = parseInt(document.getElementById("margin").value) || 12;
  const showTombo = document.getElementById("showTombo").checked;
  const showIdx = document.getElementById("showIdx").checked;
  const guideColor = document.getElementById("guideColor").value;
  const guideWeight = document.getElementById("guideWeight").value;

  const perPage = cols * rows;
  const pageCount = Math.max(1, Math.ceil(list.length / perPage));

  const usableW = 210 - margin*2;
  const usableH = 297 - margin*2 - 6; // ヘッダー分を差し引く
  const cellSize = Math.min(usableW/cols, usableH/rows);
  const fontSize = cellSize * 0.62;

  const viewer = document.getElementById("viewer");
  viewer.innerHTML = "";

  for(let p=0; p<pageCount; p++){
    const page = document.createElement("div");
    page.className = "page";
    page.style.padding = margin + "mm";

    const head = document.createElement("div");
    head.className = "page-head";
    const start = p*perPage + 1;
    const end = Math.min((p+1)*perPage, list.length);
    head.innerHTML = `<span>tegaki.svg 原稿 / No.${start}-${end}</span><span>${p+1} / ${pageCount}</span>`;
    page.appendChild(head);

    if(showTombo){
      ["tl","tr","bl","br"].forEach(pos=>{
        const t = document.createElement("div");
        t.className = "tombo " + pos;
        page.appendChild(t);
      });
    }

    const grid = document.createElement("div");
    grid.className = "grid";
    grid.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}mm)`;
    grid.style.gridTemplateRows = `repeat(${rows}, ${cellSize}mm)`;

    for(let i=0; i<perPage; i++){
      const globalIdx = p*perPage + i;
      const cell = document.createElement("div");
      cell.className = "cell" + (globalIdx >= list.length ? " empty" : "");
      if(showIdx && globalIdx < list.length){
        const idx = document.createElement("span");
        idx.className = "idx";
        idx.textContent = globalIdx + 1;
        cell.appendChild(idx);
      }
      if(globalIdx < list.length){
        const g = document.createElement("span");
        g.className = "guide";
        g.textContent = list[globalIdx];
        g.style.color = guideColor;
        g.style.fontWeight = guideWeight;
        g.style.fontSize = fontSize + "mm";
        cell.appendChild(g);
      }
      grid.appendChild(cell);
    }
    page.appendChild(grid);
    viewer.appendChild(page);

    const credit = document.createElement("div");
    credit.className = "credit";
    credit.textContent = "@nakoto_otanotion";
    page.appendChild(credit);
  }

  const statsEl = document.getElementById("stats");
  statsEl.textContent =
    `文字数: ${list.length} / 1ページ ${perPage}マス / 全 ${pageCount} ページ（生成しました ✓）`;
  statsEl.classList.remove("flash");
  void statsEl.offsetWidth; // reflow でアニメーションを再トリガー
  statsEl.classList.add("flash");
  document.getElementById("viewer").scrollTo({top:0, behavior:"smooth"});
}

document.getElementById("generate").addEventListener("click", render);
document.getElementById("printBtn").addEventListener("click", ()=>window.print());
document.getElementById("jsonBtn").addEventListener("click", ()=>{
  const data = JSON.stringify({ characters: currentList, count: currentList.length }, null, 2);
  const blob = new Blob([data], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "tegaki-char-order.json";
  a.click();
  URL.revokeObjectURL(url);
});

render();
</script>
</body>
</html>
